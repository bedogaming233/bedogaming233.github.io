    .search-box { position: relative; flex: 1; min-width: 170px; }

    @media (max-width: 560px) { .grid { grid-template-columns: minmax(0, 1fr); } }

    .rcard {
      min-width: 0; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--specular);

    /* Skeleton & Empty */
    .skel-card { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; overflow: hidden; padding-bottom: 16px; }
    .skel { background: linear-gradient(90deg, var(--shimmer-1) 25%, var(--shimmer-2) 50%, var(--shimmer-1) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .empty {
      grid-column: 1 / -1; text-align: center; padding: 40px 18px; background: var(--surface);

    .ad-slot {

    .ad-slot.ad-collapsed { display: none !important; }
    .ad-rail {

    .footer {

    .foot-copy { font-size: 12px; color: var(--muted); }

    (function initBedoSmartAds() {

        b468x60:  { key: "c8e8d01fc23f989b737c14696091128f", w: 468, h: 60,  anti: true },
        b300x250: { key: "1b3e8d2dbc99ddd864135c064c0f2f2a", w: 300, h: 250, anti: false },
        b320x50:  { key: "eb17e3aff845e4544068be8326111b68", w: 320, h: 50,  anti: false },
        b160x600: { key: "8976f2241077446934a4fc600e495d22", w: 160, h: 600, anti: true },
        b160x300: { key: "41315dda23852b7335be460fd076296f", w: 160, h: 300, anti: true }
      };
      const queue = []; let busy = false; const usedKeys = new Set();
      function runQueue() {
        if (busy || !queue.length) return;
        busy = true; queue.shift()().finally(() => { busy = false; runQueue(); });
      }
      function loadScriptInto(slotEl, unit, srcUrl, timeoutMs) {
        return new Promise((resolve) => {
          let settled = false, postLoadTimer = null;
          const finish = (ok) => { if (settled) return; settled = true; clearTimeout(timer); clearTimeout(postLoadTimer); mo.disconnect(); resolve(ok); };
          const mo = new MutationObserver(() => { if (slotEl.querySelector("iframe")) finish(true); });
          mo.observe(slotEl, { childList: true, subtree: true });
          window.atOptions = { key: unit.key, format: "iframe", height: unit.h, width: unit.w, params: {} };
          const s = document.createElement("script"); s.type = "text/javascript"; s.setAttribute("data-cfasync", "false"); s.src = srcUrl;
          s.onload = () => { if (slotEl.querySelector("iframe")) return finish(true); postLoadTimer = setTimeout(() => finish(!!slotEl.querySelector("iframe")), 2200); };
          s.onerror = () => finish(false);
          const timer = setTimeout(() => finish(!!slotEl.querySelector("iframe")), timeoutMs);
          slotEl.appendChild(s);
        });
      }
      function enqueueBanner(slotId, unit) {
        const slotEl = document.getElementById(slotId);
        if (!slotEl || !unit || usedKeys.has(unit.key)) { if (slotEl) slotEl.classList.add("ad-collapsed"); return; }
        usedKeys.add(unit.key);
        queue.push(async () => {
          slotEl.innerHTML = "";
          let ok = await loadScriptInto(slotEl, unit, "https://www.highperformanceformat.com/" + unit.key + "/invoke.js", 5000);
          if (!ok && unit.anti) { slotEl.innerHTML = ""; ok = await loadScriptInto(slotEl, unit, "https://bellnewyork.org/22/" + unit.key, 4500); }
          slotEl.classList.remove("ad-pending", ok ? "ad-collapsed" : "ad-ready");
          slotEl.classList.add(ok ? "ad-ready" : "ad-collapsed");
        });
        runQueue();
      }
      const vw = window.innerWidth || document.documentElement.clientWidth || 360;
      enqueueBanner("ad-top", vw >= 760 ? UNITS.b728x90 : UNITS.b320x50);
      enqueueBanner("ad-mid", UNITS.b300x250);
      if (vw >= 1360) { enqueueBanner("ad-rail-left", UNITS.b160x600); enqueueBanner("ad-rail-right", UNITS.b160x300); }
      const nativeSlot = document.getElementById("ad-native"), nativeBox = document.getElementById("container-5b38501e9f95039d29df080b96b84b0a"), nativeScript = document.getElementById("nativeAdScript");
      let nativeResolved = false, obs = null;
      function mountBottom(ok) {
        const el = document.getElementById("ad-bottom"); if (!el) return;
        if (vw >= 760) enqueueBanner("ad-bottom", ok ? UNITS.b468x60 : UNITS.b320x50);
        else if (vw >= 490) enqueueBanner("ad-bottom", ok ? UNITS.b468x60 : UNITS.b160x300);
        else if (ok) enqueueBanner("ad-bottom", UNITS.b160x300);
        else el.classList.add("ad-collapsed");
      }
      function onOk() { if (nativeResolved) return; nativeResolved = true; clearTimeout(nt); if (obs) obs.disconnect(); nativeSlot.classList.remove("ad-pending","ad-collapsed"); nativeSlot.classList.add("ad-ready"); mountBottom(true); }
      function onFail() { if (nativeResolved) return; nativeResolved = true; clearTimeout(nt); if (obs) obs.disconnect(); enqueueBanner("ad-native", vw >= 490 ? UNITS.b468x60 : UNITS.b160x300); mountBottom(false); }

  <!-- LIBRARY LOGIC + SECRET 5-TAP STUDIO UNLOCK -->
  <script>
    const API_BASE = "https://bedo-community-api.vercel.app";
    let lang = localStorage.getItem("bedo_lang") || "ar";
    let currentCat = "all";
    let currentSort = "featured";
    let searchQ = "";
    let searchTimer = null;
    let cachedItems = [];
    let cachedCounts = { all: 0, games: 0, mods: 0, apps: 0, files: 0 };

    const CAT_LABELS = {
      ar: { all: "الكل", games: "الألعاب", mods: "المودات والباتشات", apps: "التطبيقات", files: "ملفات حصرية" },
      en: { all: "All", games: "Games", mods: "Mods & Patches", apps: "Apps", files: "Exclusive Files" }
    };

    function escapeHtml(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }

    function coverSrc(item) {
      if (item.has_cover_data) return `${API_BASE}/api/catalog/${item.id}/cover?v=${item.updated_at || 1}`;
      if (item.cover_url) return item.cover_url;
      return "";
    }

    function catIconSvg(cat) {
      if (cat === "mods") return '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#d4af6a" stroke-width="1.3"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>';
      if (cat === "apps") return '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#30d158" stroke-width="1.3"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>';
      if (cat === "files") return '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#64d2ff" stroke-width="1.3"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
      return '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#f5f5f7" stroke-width="1.3"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/></svg>';
    }

    function renderSkeletons() {
      document.getElementById("catalogGrid").innerHTML = [1,2,3].map(() => `
        <div class="skel-card">
          <div class="skel" style="aspect-ratio:16/9.5;"></div>
          <div style="padding:16px;display:flex;flex-direction:column;gap:10px;">
            <div class="skel" style="height:16px;width:72%;border-radius:8px;"></div>
            <div class="skel" style="height:12px;width:94%;border-radius:8px;"></div>
            <div class="skel" style="height:32px;width:100%;border-radius:999px;margin-top:8px;"></div>
          </div>
        </div>
      `).join("");
    }

    function renderSpotlight(items) {
      const wrap = document.getElementById("spotlightWrap");
      const feat = items.find(x => x.featured === 1) || items[0];
      if (!feat || searchQ || currentCat !== "all") { wrap.innerHTML = ""; return; }
      const ar = lang === "ar";
      const title = ar ? feat.title_ar : (feat.title_en || feat.title_ar);
      const sum = ar ? feat.summary_ar : (feat.summary_en || feat.summary_ar);
      const src = coverSrc(feat);
      const href = `./download.html?id=${feat.id}`;
      wrap.innerHTML = `
        <div class="spotlight">
          <div>
            <div class="feat-badge">★ ${ar ? "الإصدار المميز • مثبّت من المطور" : "Featured Release • Developer Pick"}</div>
            <h1>${escapeHtml(title)}</h1>
            <p>${escapeHtml(sum)}</p>
            <div class="sp-actions">
              <a class="btn-blue" href="${href}">${ar ? "تحميل مباشر" : "Download Now"}${feat.file_size ? ` — <span class="num">${escapeHtml(feat.file_size)}</span>` : ""}</a>
              <a class="btn-ghost" href="${href}">${ar ? "التفاصيل والتعليقات" : "Details &amp; Reviews"} ↗</a>
            </div>
          </div>
          <div class="sp-art">
            ${src ? `<img src="${escapeHtml(src)}" alt="${escapeHtml(title)}" />` : `<div style="width:100%;height:100%;display:grid;place-items:center;">${catIconSvg(feat.category)}</div>`}
            <div class="sp-art-fade"></div>
            <div class="sp-art-tags">
              ${feat.file_size ? `<span class="sp-art-tag num">${escapeHtml(feat.file_size)}</span>` : ""}
              <span class="sp-art-tag num">${escapeHtml(feat.version)}</span>
              <span class="sp-art-tag num">${Number(feat.downloads || 0).toLocaleString()} ${ar ? "تحميل" : "DLs"}</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderGrid() {
      const grid = document.getElementById("catalogGrid");
      const ar = lang === "ar";
      const labels = CAT_LABELS[lang] || CAT_LABELS.ar;
      renderSpotlight(cachedItems);

      if (!cachedItems.length) {
        grid.innerHTML = `<div class="empty">${ar ? "لا توجد ملفات في هذا القسم حالياً." : "No releases found in this category yet."}</div>`;
        return;
      }

      grid.innerHTML = cachedItems.map(item => {
        const title = ar ? item.title_ar : (item.title_en || item.title_ar);
        const sum = ar ? item.summary_ar : (item.summary_en || item.summary_ar);
        const src = coverSrc(item);
        const catLbl = labels[item.category] || item.category;
        return `
          <a class="rcard" href="./download.html?id=${item.id}">
            <div class="rcover cat-${escapeHtml(item.category)}">
              ${src ? `<img src="${escapeHtml(src)}" alt="${escapeHtml(title)}" loading="lazy" onerror="this.remove()" />` : catIconSvg(item.category)}
              <div class="rcover-ov"></div>
              <span class="rcat">${escapeHtml(catLbl)}</span>
              <span class="rhost num">${escapeHtml(item.host_label || "Direct")}</span>
            </div>
            <div class="rbody">
              <div class="rtitle">${escapeHtml(title)}</div>
              <div class="rdesc">${escapeHtml(sum)}</div>
              <div class="rmeta">
                <span class="num">${escapeHtml(item.version)}</span>
                <span class="num">${escapeHtml(item.file_size || "—")}</span>
              </div>
              <div class="rfoot">
                <span class="rdl-cnt">● <span class="num">${Number(item.downloads || 0).toLocaleString()}</span> ${ar ? "تحميل" : "DLs"}</span>
                <span class="rbtn">${ar ? "تحميل" : "Get"} ↓</span>
              </div>
            </div>
          </a>
        `;
      }).join("");
    }

    function updateCatLabels() {
      const labels = CAT_LABELS[lang] || CAT_LABELS.ar;
      ["all","games","mods","apps","files"].forEach(k => {
        const el = document.getElementById("cat-" + k);
        if (!el) return;
        const c = cachedCounts[k] || 0;
        el.innerHTML = c > 0 ? `${labels[k]} <span class="num" style="opacity:.7">(${c})</span>` : labels[k];
      });
    }

    async function fetchCatalog() {
      renderSkeletons();
      try {
        const qs = new URLSearchParams({ category: currentCat, sort: currentSort, q: searchQ });
        const res = await fetch(`${API_BASE}/api/catalog?${qs.toString()}`);
        const data = await res.json();
        if (!data.ok) throw new Error("API");
        cachedItems = data.items || [];
        if (data.counts) cachedCounts = data.counts;
        updateCatLabels();
        renderGrid();
      } catch (e) {
        document.getElementById("catalogGrid").innerHTML = `<div class="empty">${lang === "ar" ? "تعذر تحميل المكتبة حالياً — جرب تحديث الصفحة." : "Could not load library right now."}</div>`;
      }
    }

    function setCat(c) {
      currentCat = c;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.toggle("active", b.dataset.cat === c));
      fetchCatalog();
    }
    function setSort(s) {
      currentSort = s;
      document.getElementById("sort-featured").classList.toggle("active", s === "featured");
      document.getElementById("sort-popular").classList.toggle("active", s === "popular");
      fetchCatalog();
    }
    function onSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { searchQ = document.getElementById("searchInp").value.trim(); fetchCatalog(); }, 300);
    }

    /* Theme + Lang */
    function syncThemeIcon() {
      const isDark = document.documentElement.getAttribute("data-theme") !== "light";
      const ico = document.getElementById("themeIco");
      if (!ico) return;
      ico.innerHTML = isDark
        ? '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>'
        : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    }
    function toggleTheme() {
      const next = (document.documentElement.getAttribute("data-theme") || "dark") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("bedo_theme", next); } catch(e){}
      syncThemeIcon();
    }
    function applyLang() {
      const ar = lang === "ar";
      document.documentElement.lang = lang;
      document.documentElement.dir = ar ? "rtl" : "ltr";
      document.getElementById("langBtn").textContent = ar ? "EN" : "العربية";
      document.getElementById("n-lib").textContent = ar ? "المكتبة والتحميلات" : "Library";
      document.getElementById("n-comm").textContent = ar ? "مجتمع اللاعبين" : "Community";
      document.getElementById("m-lib").textContent = ar ? "المكتبة" : "Library";
      document.getElementById("m-comm").textContent = ar ? "المجتمع" : "Community";
      document.getElementById("searchInp").placeholder = ar ? "ابحث عن لعبة، مود، أو تطبيق..." : "Search games, mods, or apps...";
      document.getElementById("sort-featured").textContent = ar ? "الأحدث" : "Newest";
      document.getElementById("sort-popular").textContent = ar ? "الأكثر تحميلاً" : "Most Downloaded";
      document.getElementById("f-comm").textContent = ar ? "مجتمع اللاعبين" : "Community";
      updateCatLabels();
      if (cachedItems.length) renderGrid();
    }
    function toggleLang() {
      lang = lang === "ar" ? "en" : "ar";
      try { localStorage.setItem("bedo_lang", lang); } catch(e){}
      applyLang();
    }

    /* Secret 5-Tap Unlock on BG Logo (zero reload on tap 1!) + Ctrl+Shift+B */
    (function bindSecretUnlock() {
      let taps = 0, tapTimer = null;
      const logo = document.getElementById("secretLogo");
      if (logo) {
        logo.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          taps++;
          clearTimeout(tapTimer);
          if (taps >= 5) { taps = 0; window.location.href = "./studio.html"; return; }
          tapTimer = setTimeout(() => { taps = 0; }, 2200);
        });
      }
      document.addEventListener("keydown", (e) => {
        if (e.ctrlKey && e.shiftKey && (e.key === "B" || e.key === "b")) {
          e.preventDefault();
          window.location.href = "./studio.html";
        }
      });
    })();

    const scrollBar = document.getElementById("scrollBar");
    window.addEventListener("scroll", () => {
      const h = document.documentElement;
      if (scrollBar) scrollBar.style.width = Math.min(100, Math.max(0, (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight)) * 100)) + "%";
    }, { passive: true });

    syncThemeIcon();
    applyLang();
    fetchCatalog();
  </script>
