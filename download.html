      const queue = []; let busy = false; const usedKeys = new Set();
      function runQueue() { if (busy || !queue.length) return; busy = true; queue.shift()().finally(() => { busy = false; runQueue(); }); }
      function loadScriptInto(slotEl, unit, srcUrl, timeoutMs) {
        return new Promise((resolve) => {
          let settled = false, postLoadTimer = null;
          const finish = (ok) => { if (settled) return; settled = true; clearTimeout(timer); clearTimeout(postLoadTimer); mo.disconnect(); resolve(ok); };
          const mo = new MutationObserver(() => { if (slotEl.querySelector("iframe")) finish(true); });
          mo.observe(slotEl, { childList: true, subtree: true });
          window.atOptions = { key: unit.key, format: "iframe", height: unit.h, width: unit.w, params: {} };
          const s = document.createElement("script"); s.type = "text/javascript"; s.setAttribute("data-cfasync", "false"); s.src = srcUrl;
          s.onload = () => { if (slotEl.querySelector("iframe")) return finish(true); postLoadTimer = setTimeout(() => finish(!!slotEl.querySelector("iframe")), 2200); };

          slotEl.classList.remove("ad-pending", ok ? "ad-collapsed" : "ad-ready");

        });
        runQueue();
      }
      const vw = window.innerWidth || document.documentElement.clientWidth || 360;

      function onFail() { if (nativeResolved) return; nativeResolved = true; clearTimeout(nt); if (obs) obs.disconnect(); enqueueBanner("ad-native", vw >= 490 ? UNITS.b468x60 : UNITS.b160x300); mountBottom(false); }

      const src = coverSrc(it);
      const catLbl = (CAT_LABELS[lang] || CAT_LABELS.ar)[it.category] || it.category;

              <div class="spec"><span>${ar ? "عدد التحميلات" : "Downloads"}</span><b class="num" id="dlCountVal" style="color:var(--green)">${Number(it.downloads || 0).toLocaleString()}</b></div>
            </div>
          </div>

              <span class="tag">${escapeHtml(catLbl)}</span>
              <span class="tag ok">✓ ${ar ? "ملف مفحوص وآمن" : "Tested &amp; Safe"}</span>
              ${it.featured ? `<span class="tag gold">★ ${ar ? "مميز" : "Featured"}</span>` : ""}

              <span class="ring-wrap"><svg class="ring-svg" width="18" height="18" viewBox="0 0 18 18"><circle class="ring-track" cx="9" cy="9" r="7"/><circle class="ring-fill" id="dlRing" cx="9" cy="9" r="7"/></svg></span>
              <span id="dlTxt">${ar ? "تحميل مباشر الآن" : "Direct Download Now"}${it.file_size ? ` — <span class="num">${escapeHtml(it.file_size)}</span>` : ""}</span>

                ? `<a class="btn-g" href="${escapeHtml(it.mirror_url)}" target="_blank" rel="noopener">${ar ? "رابط احتياطي ↗" : "Backup Mirror ↗"}</a>`

              }

      document.getElementById("commentsSection").style.display = "block";

      renderComments();

    function renderComments() {
      const list = document.getElementById("cList");
      const ar = lang === "ar";
      if (!itemComments.length) {
        list.innerHTML = `<div style="text-align:center;color:var(--muted);font-size:13px;padding:16px 0;">${ar ? "لا توجد تعليقات على هذا الملف بعد — كن أول من يشارك تجربته!" : "No comments yet — be the first to review this file!"}</div>`;

      const verifiedSvg = `<svg width="13" height="13" viewBox="0 0 24 24" fill="var(--blue)"><path d="M12 2l2.39 1.66 2.9-.24 1.15 2.67 2.57 1.38-.52 2.86L22 12.8l-1.51 2.47.52 2.86-2.57 1.38-1.15 2.67-2.9-.24L12 23.6l-2.39-1.66-2.9.24-1.15-2.67-2.57-1.38.52-2.86L2 12.8l1.51-2.47-.52-2.86 2.57-1.38 1.15-2.67 2.9.24L12 2zm-1.1 14.2l5.3-5.3-1.4-1.4-3.9 3.9-1.9-1.9-1.4 1.4 3.3 3.3z"/></svg>`;
      list.innerHTML = itemComments.map((c, idx) => {
        const init = String(c.author || "?").trim().slice(0,2).toUpperCase();
        const stars = c.rating ? `<span style="color:var(--gold)">${"★".repeat(c.rating)}${"☆".repeat(5-c.rating)}</span>` : "";
        const reply = c.dev_reply ? `

            </div>
            <div class="c-body">${escapeHtml(c.body)}</div>
            ${reply}

      }).join("");
    }

    function renderRelated() {
      const wrap = document.getElementById("relatedWrap");
      if (!relatedItems.length) { wrap.innerHTML = ""; return; }
      const ar = lang === "ar";
      wrap.innerHTML = `
        <h3 class="rel-head">${ar ? "إصدارات أخرى من Bedo Gaming" : "More from Bedo Gaming"}</h3>
        <div class="rel-grid">
          ${relatedItems.map(r => {
            const t = ar ? r.title_ar : (r.title_en || r.title_ar);

            return `
              <a class="rel-card" href="./download.html?id=${r.id}">
                <div class="rel-cov">${s ? `<img src="${escapeHtml(s)}" alt="${escapeHtml(t)}" loading="lazy" />` : `<span class="num" style="color:var(--muted)">BG</span>`}</div>
                <div class="rel-in"><b>${escapeHtml(t)}</b><span class="num">${escapeHtml(r.version)} • ${escapeHtml(r.file_size || "Direct")}</span></div>
              </a>`;
          }).join("")}
        </div>
      `;
    }

    function startItemDownload() {
      if (!currentItem || counting) return;
      counting = true;
      if (WEBSITE_SMARTLINK_URL) window.open(WEBSITE_SMARTLINK_URL, "_blank", "noopener");
      // Increment live download counter on D1
      fetch(`${API_BASE}/api/catalog/${currentItem.id}/download`, {
        method: "POST", headers: { "X-Client-Id": getClientId() }
      }).then(r => r.json()).then(d => {
        if (d.ok) {
          currentItem.downloads = d.downloads;
          const el = document.getElementById("dlCountVal");
          if (el) el.textContent = Number(d.downloads).toLocaleString();
        }
      }).catch(() => {});

      const btn = document.getElementById("dlBtn"), txt = document.getElementById("dlTxt"), ring = document.getElementById("dlRing");
      btn.disabled = true; btn.classList.add("is-loading");
      let sec = 5;
      const tick = () => {
        if (ring) ring.style.strokeDashoffset = String(44 * (sec / 5));
        if (sec <= 0) {
          txt.textContent = lang === "ar" ? "جاري فتح رابط التحميل..." : "Opening Download Link...";
          window.location.href = currentItem.download_url;
          setTimeout(() => {
            btn.disabled = false; btn.classList.remove("is-loading"); if (ring) ring.style.strokeDashoffset = "44"; counting = false;
            txt.innerHTML = (lang === "ar" ? "تحميل مباشر الآن" : "Direct Download Now") + (currentItem.file_size ? ` — <span class="num">${escapeHtml(currentItem.file_size)}</span>` : "");
          }, 3000);
          return;
        }
        txt.textContent = lang === "ar" ? `تجهيز الرابط السريع (${sec} ث)...` : `Preparing fast link (${sec}s)...`;
        sec--; setTimeout(tick, 1000);
      };
      tick();
    }

    async function toggleReaction(kind) {
      if (!currentItem) return;
      try {
        const res = await fetch(`${API_BASE}/api/catalog/${currentItem.id}/react`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Client-Id": getClientId() },
          body: JSON.stringify({ kind })
        });
        const data = await res.json();
        if (!data.ok) return;
        if (data.active) viewerReacts.add(kind); else viewerReacts.delete(kind);
        currentItem.works_count = data.works_count;
        currentItem.broken_reports = data.broken_reports;
        renderItem();
        if (kind === "broken" && data.active) showToast(lang === "ar" ? "تم إرسال البلاغ للمطور لفحص الرابط" : "Broken link reported to developer");
      } catch {}
    }

    function copyShareLink() {
      navigator.clipboard?.writeText(window.location.href).then(() => {
        showToast(lang === "ar" ? "تم نسخ رابط التحميل للمشاركة" : "Share link copied");
      }).catch(() => showToast(window.location.href));
    }
    function shareTelegram() {
      const u = encodeURIComponent(window.location.href);
      const t = encodeURIComponent(currentItem ? currentItem.title_ar : "Bedo Gaming");
      window.open(`https://t.me/share/url?url=${u}&text=${t}`, "_blank", "noopener");
    }

    function renderCStars() {
      const el = document.getElementById("cStars");
      el.innerHTML = "";
      for (let i = 1; i <= 5; i++) {
        const s = document.createElement("span");
        s.textContent = i <= cStarsVal ? "★" : "☆";
        s.className = i <= cStarsVal ? "star-on" : "star-off";
        s.onclick = () => { cStarsVal = i; renderCStars(); };
        el.appendChild(s);
      }
    }

    async function submitItemComment() {
      if (!currentItem) return;
      const btn = document.getElementById("cSendBtn"), msg = document.getElementById("cMsg");
      const author = document.getElementById("cName").value.trim();
      const device = document.getElementById("cDevice").value.trim();
      const body = document.getElementById("cBody").value.trim();
      msg.className = "msg-box"; btn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/api/catalog/${currentItem.id}/comments`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Client-Id": getClientId() },
          body: JSON.stringify({ author, device, rating: cStarsVal, body })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          msg.textContent = lang === "ar" ? (data.error_ar || "تعذر الإرسال") : (data.error_en || "Failed");
          msg.className = "msg-box err"; return;
        }
        localStorage.setItem("bedo_user_name", author);
        if (device) localStorage.setItem("bedo_user_device", device);
        document.getElementById("cBody").value = "";
        itemComments.unshift(data.comment);
        document.getElementById("c-avg").textContent = `${Number(currentItem.avg_rating || 5).toFixed(1)} ★ (${itemComments.length})`;
        renderComments();
        msg.textContent = lang === "ar" ? "تم نشر تعليقك بنجاح" : "Your comment is live";
        msg.className = "msg-box ok";
      } catch {
        msg.textContent = lang === "ar" ? "خطأ في الاتصال." : "Network error."; msg.className = "msg-box err";
      } finally { btn.disabled = false; }
    }

    async function loadItem() {
      const id = new URLSearchParams(location.search).get("id") || "1";
      try {
        const res = await fetch(`${API_BASE}/api/catalog/${encodeURIComponent(id)}`, { headers: { "X-Client-Id": getClientId() } });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error("not found");
        currentItem = data.item;
        itemComments = data.comments || [];
        viewerReacts = new Set(data.viewer_reactions || []);
        relatedItems = data.related || [];
        renderItem();
      } catch {
        document.getElementById("itemRoot").innerHTML = `<div class="box" style="text-align:center;padding:42px 20px;color:var(--muted);">${lang === "ar" ? "الملف المطلوب غير موجود أو تم حذفه." : "Release not found."} <br><br><a class="btn-g" href="./library.html">${lang === "ar" ? "العودة للمكتبة" : "Back to Library"}</a></div>`;
      }
    }

    function syncThemeIcon() {
      const isDark = document.documentElement.getAttribute("data-theme") !== "light";
      const ico = document.getElementById("themeIco");
      if (ico) ico.innerHTML = isDark
        ? '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>'
        : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    }
    function toggleTheme() {
      const next = (document.documentElement.getAttribute("data-theme") || "dark") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("bedo_theme", next); } catch(e){}
      syncThemeIcon();
    }
    function applyLang() {
      const ar = lang === "ar";
      document.documentElement.lang = lang; document.documentElement.dir = ar ? "rtl" : "ltr";
      document.getElementById("langBtn").textContent = ar ? "EN" : "العربية";
      document.getElementById("n-lib").textContent = ar ? "المكتبة والتحميلات" : "Library";
      document.getElementById("n-comm").textContent = ar ? "مجتمع اللاعبين" : "Community";
      document.getElementById("crumbBack").textContent = ar ? "→ العودة للمكتبة الرسمية" : "← Back to Official Library";
      document.getElementById("c-title").textContent = ar ? "اترك تعليقاً وتقييماً لهذا الملف" : "Leave a Comment & Rating";
      document.getElementById("c-rate-lbl").textContent = ar ? "تقييمك للملف:" : "Your Rating:";
      document.getElementById("cName").placeholder = ar ? "اسمك (مثلاً: محمد علاء)" : "Your name";
      document.getElementById("cDevice").placeholder = ar ? "نوع موبايلك (اختياري)" : "Device model (optional)";
      document.getElementById("cBody").placeholder = ar ? "شاركنا تجربتك: هل التحميل سريع؟ هل اشتغل تمام على جهازك؟" : "Share your experience with this download...";
      document.getElementById("cSendBtn").textContent = ar ? "نشر التعليق" : "Post Comment";
      if (currentItem) renderItem();
    }
    function toggleLang() {
      lang = lang === "ar" ? "en" : "ar";
      try { localStorage.setItem("bedo_lang", lang); } catch(e){}
      applyLang();
    }

    // Secret 5-tap unlock
    (function(){
      let t=0, tm=null;
      const el = document.getElementById("secretLogo");
      if (!el) return;
      el.addEventListener("click", (e) => {
        t++; clearTimeout(tm);
        if (t >= 5) { e.preventDefault(); e.stopPropagation(); t=0; location.href = "./studio.html"; return; }
        if (t >= 2) { e.preventDefault(); e.stopPropagation(); }
        tm = setTimeout(() => { t=0; }, 1400);
      });
    })();

    const sn = localStorage.getItem("bedo_user_name"), sd = localStorage.getItem("bedo_user_device");
    if (sn) document.getElementById("cName").value = sn;
    if (sd) document.getElementById("cDevice").value = sd;

    syncThemeIcon();
    renderCStars();
    applyLang();
    loadItem();
  </script>
</body>
</html>
